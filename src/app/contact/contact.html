<div class="bg-[#101522] min-h-screen flex flex-col pt-10">
  <main class="grow max-w-4xl mx-auto px-6 py-12 w-full relative z-10">
    <div class="text-center mb-12">
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Get in Touch</h1>
      <p class="text-slate-400">We'd love to hear from you. Please fill out this form.</p>
    </div>

    <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-8 shadow-2xl">
      @if (isMessageSent()) {
        <div class="text-center py-12">
          <div
            class="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4"
          >
            <span class="material-icons text-green-500 text-3xl">check</span>
          </div>
          <h2 class="text-2xl font-semibold text-white mb-2">Message Sent!</h2>
          <p class="text-slate-400">We'll get back to you as soon as possible.</p>
        </div>
      } @else {
        <div class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label class="text-sm font-medium text-slate-300">Your Name</label>
              <input
                type="text"
                name="name"
                required
                [value]="contact().name"
                (change)="handleInput($event)"
                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                placeholder="John Doe"
              />
            </div>
            <div class="space-y-2">
              <label class="text-sm font-medium text-slate-300">Your Email</label>
              <input
                type="email"
                name="email"
                required
                [value]="contact().email"
                (change)="handleInput($event)"
                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                placeholder="john@example.com"
              />
            </div>
          </div>
          <div class="space-y-2">
            <label class="text-sm font-medium text-slate-300">Message</label>
            <textarea
              required
              [value]="contact().message"
              (change)="handleInput($event)"
              rows="5"
              class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none"
              placeholder="How can we help you?"
            ></textarea>
          </div>
          <button
            class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-4 rounded-xl transition-all shadow-lg shadow-primary/20 hover:shadow-primary/40 flex items-center justify-center gap-2"
            (click)="handleSubmit()"
          >
            <span>Send Message</span>
            <span class="material-icons text-sm">send</span>
          </button>
        </div>
      }
    </div>
  </main>

  <div class="fixed bottom-0 left-0 w-full h-1/3 z-0 opacity-10 pointer-events-none">
    <div class="absolute inset-0 bg-linear-to-t from-primary/20 to-transparent"></div>
  </div>

  <app-footer></app-footer>
</div>
