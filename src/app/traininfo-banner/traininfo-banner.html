<div
  class="glass-card rounded-xl p-6 mb-8 flex flex-wrap items-center justify-between gap-6 border-l-4 border-l-primary"
>
  <div class="flex items-center gap-6">
    <div>
      <span class="text-xs font-semibold text-primary uppercase tracking-wider">Train Details</span>
      <h2 class="text-xl font-bold">{{ train().trainNumber }} - {{ train().trainName }}</h2>
      <p class="text-sm text-slate-400">{{ train().source }} → {{ train().destination }}</p>
    </div>
    <div class="h-10 w-px bg-white/10 hidden sm:block"></div>
    <div>
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider"
        >Class &amp; Quota</span
      >
      <div class="flex items-center gap-2 mt-1">
        <span class="px-2 py-0.5 bg-primary/20 text-primary text-xs font-bold rounded uppercase">{{
          selectedClass().className
        }}</span>
        <span class="px-2 py-0.5 bg-white/10 text-slate-300 text-xs font-bold rounded"
          >GENERAL</span
        >
      </div>
    </div>
  </div>
  <div class="flex items-center gap-4">
    <div class="text-right">
      <span class="text-xs font-semibold uppercase tracking-wider">Availability Status</span>
      <div class="flex items-center gap-2 mt-1 justify-end">
        <span class="w-2 h-2 rounded-full"></span>
        <span class="font-bold"> {{selectedClass().availableSeats}} </span>
      </div>
    </div>
  </div>
</div>
