@if (alerts(); as alerts) {
  <div
    className="mt-16 bg-primary/10 border border-primary/20 rounded-lg p-4 flex items-center gap-4"
  >
    <span
      className="bg-primary px-3 py-1 rounded-md text-[10px] font-black uppercase tracking-widest text-white shrink-0"
      >News Alert</span
    >
    <div className="overflow-hidden whitespace-nowrap flex space-x-12">
      @for (alert of alerts; track alert.id) {
        <p className="text-sm text-primary animate-pulse inline-block">{{ alert.message }}</p>
      }
    </div>
  </div>
}
