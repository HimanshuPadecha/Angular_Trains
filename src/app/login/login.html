<style>
  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }

  .rotating-icon {
    animation: spin 1.5s linear infinite;
  }
</style>

<div
  class="min-h-[calc(100vh-80px)] flex items-center justify-center p-4 relative overflow-hidden pt-12"
>
  <div
    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-150 h-150 bg-primary/20 rounded-full blur-[120px] pointer-events-none opacity-50 z-0"
  ></div>

  <div
    class="w-full max-w-md bg-[#182032] border border-white/10 p-8 rounded-2xl backdrop-blur-xl shadow-[0_0_40px_rgba(0,0,0,0.5)] relative z-10 transition-all"
  >
    <div class="text-center mb-8">
      <div
        class="w-14 h-14 bg-primary text-white rounded-xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-primary/30"
      >
        <span class="material-icons text-3xl">train</span>
      </div>
      <h2 class="text-2xl font-bold tracking-tight text-white mb-2">Welcome Back</h2>
      <p class="text-slate-400 text-sm">Sign in to manage your journeys and bookings.</p>
    </div>

    <div class="space-y-5">
      @if (error()) {
        <div
          class="bg-red-500/10 border border-red-500/20 text-red-400 text-sm p-3 rounded-lg text-center"
        >
          {{ error() }}
        </div>
      }
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">
          Username
        </label>
        <div class="relative">
          <span
            class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"
          >
            person
          </span>
          <input
            type="text"
            #usernameInput
            [value]="username()"
            (input)="onUsernameInput($event)"
            class="w-full bg-white/5 border border-white/10 rounded-xl pl-11 pr-4 py-3.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
            placeholder="Username"
            required
          />
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest">
            Password
          </label>
          <a
            href="#"
            class="text-xs font-semibold text-primary hover:text-primary/80 transition-colors"
          >
            Forgot Password?
          </a>
        </div>
        <div class="relative">
          <span
            class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"
          >
            lock
          </span>
          <input
            [type]="isPasswordVisible ? 'text' : 'password'"
            [value]="password()"
            (input)="password.set($event.target.value)"
            class="w-full bg-white/5 border border-white/10 rounded-xl pl-11 pr-12 py-3.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
            placeholder="••••••••"
            required
          />
          <button
            type="button"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors flex items-center justify-center p-1"
          >
            @if (isPasswordVisible) {
              <span class="material-icons text-sm" (click)="isPasswordVisible = false">
                visibility
              </span>
            } @else {
              <span class="material-icons text-sm" (click)="isPasswordVisible = true">
                visibility_off
              </span>
            }
          </button>
        </div>
      </div>

      <button
        (click)="handleLogin()"
        [disabled]="loading()"
        class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2 mt-4 active:scale-[0.98] disabled:opacity-70"
      >
        @if (!loading()) {
          Log In
          <span class="material-icons text-sm">arrow_forward</span>
        } @else {
          <span class="material-icons rotating-icon opacity-50">autorenew</span>
          <span class="opacity-50">Signing you in...</span>
        }
      </button>
    </div>

    <div class="mt-8 relative flex items-center justify-center">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-white/10"></div>
      </div>
    </div>

    <p class="mt-8 text-center text-sm text-slate-400">
      Don't have an account?
      <span routerLink="/signup" class="cursor-pointer hover:border-b-2">Create Account</span>
    </p>
  </div>
</div>
